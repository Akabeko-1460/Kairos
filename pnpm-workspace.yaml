packages:
  - "apps/*"
  - "packages/*"

# create-next-app が apps/web に生成した設定をルートへ統合。
# sharp / unrs-resolver はネイティブビルドを含み、承認なしのビルドスクリプト実行を避けるため無視する。
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# esbuild (vitest 経由) はプラットフォーム用バイナリの取得に postinstall が必須なので明示的に許可する。
onlyBuiltDependencies:
  - esbuild
