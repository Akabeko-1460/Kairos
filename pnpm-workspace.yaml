packages:
  - "apps/*"
  - "packages/*"

# create-next-app が apps/web に生成した設定をルートへ統合。
# 依存パッケージの postinstall を実行してよいかの許可リスト
# （pnpm 11 で onlyBuiltDependencies / ignoredBuiltDependencies が allowBuilds に統合された）。
allowBuilds:
  # vitest 経由。プラットフォーム用バイナリの取得に postinstall が必須。
  esbuild: true
  # ネイティブビルドを含むため、承認していないビルドスクリプトの実行を避ける。
  sharp: false
  unrs-resolver: false
